name: CI

# Why this exists
#
# Every verification for a long stretch of this project's life was one person on
# one machine: macOS, arm64. That is how `stderr` — a global `var` in glibc, and
# therefore off limits to a `@Sendable` closure under Swift 6 — sat in the tree
# as a build-breaking failure on Linux while compiling cleanly on macOS *and* on
# both static-musl cross-builds. The platform record claimed "359 tests pass" on
# Linux; the suite had grown to 1375 underneath it.
#
# So the point of this file is narrow and specific: make the claims in
# `docs/platforms.md` re-check themselves.
#
# `linux-integration` was added later and deferred for a while on the argument
# that a knowingly red job trains people to ignore CI. That argument expired
# once the Linux suite went green six runs running — and the deferral had a
# cost: two bugs lived for hours that only Linux could see, both found by hand
# in a container rather than by anything automatic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux glibc
    runs-on: ubuntu-latest
    # Pinned to the toolchain developed against, so a failure here is the
    # platform rather than a version difference.
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build --build-tests

      # The MySQL and Postgres suites skip: they need the fixtures from
      # ./Scripts/test-servers.sh, which are not running here. What does run is
      # every state machine, every codec, the query builder and the whole SQLite
      # suite — around 780 of the 1375, and the portion where a platform
      # difference actually shows up.
      #
      # Those suites *skipping* rather than failing is itself load-bearing, and
      # is what `test-hygiene.sh` below enforces.
      - name: Test
        run: swift test

      - name: Test hygiene
        run: ./Scripts/test-hygiene.sh


  linux-integration:
    name: Linux integration (real servers)
    runs-on: ubuntu-latest
    container: swift:6.3.3
    # Longer than the suite needs, because the step that dominates is
    # downloading three database distributions on a cold cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `libaio.so.1` is what MariaDB links against and noble ships
      # `libaio.so.1t64`, so the symlink is not optional. `xz-utils` is for
      # MySQL, which publishes `.tar.xz` on Linux and `.tar.gz` on macOS.
      - name: Install fixture dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq curl libaio1t64 libncurses6 libnuma1 xz-utils
          ARCH=$(uname -m)
          ln -sf /usr/lib/$ARCH-linux-gnu/libaio.so.1t64 /usr/lib/$ARCH-linux-gnu/libaio.so.1

      # The distributions, not the data directories: seeded state has to be
      # built fresh or a schema change would be masked by a stale fixture.
      - name: Cache database distributions
        uses: actions/cache@v4
        with:
          path: .testservers/dist-linux-x86_64
          key: testservers-dist-${{ runner.os }}-${{ hashFiles('testservers/servers.conf') }}

      - name: Start the fixtures
        run: ./Scripts/test-servers.sh up

      # What the fixture actually built, printed rather than assumed.
      #
      # PARSEC availability is a property of the build, not of the version: the
      # x86_64 Linux MariaDB tarballs used to ship the *client* plugin
      # (`parsec.so`) without the server one (`auth_parsec.so`), so those suites
      # skipped here and passed on macOS, and nothing said so out loud. The
      # binaries now build every triple from source and carry `auth_parsec.so`.
      #
      # This is the line that says whether that holds. An empty `.plugins` on
      # x86_64 means the parsec suites are silently not running.
      - name: Fixture capabilities
        run: |
          for d in .testservers/data-*/*; do
            [ -d "$d" ] || continue
            echo "$(basename "$d"): $(cat "$d/.plugins" 2>/dev/null | tr '\n' ' ')"
          done

      # **Three runs, not one.** Both bugs found on this platform today appeared
      # intermittently — the read timeout in two runs of four, the online-DDL
      # cutover in one of four — and each passed on macOS every time. A single
      # green run is a sample, and treating it as a verdict is exactly how
      # fifteen Linux-only failures accumulated unnoticed.
      - name: Test (three consecutive runs)
        run: |
          for run in 1 2 3; do
            echo "── run $run ──"
            swift test
          done

      # Runs even when the suite fails: the server logs are usually the only
      # record of why, and a failed job that discards them costs another whole
      # cycle to reproduce.
      - name: Server logs
        if: always()
        run: tail -n 50 .testservers/run-linux-*/*.log || true


  # The oldest Swift this package claims to support.
  #
  # `swift-tools-version: 6.0` is a promise, and until now nothing checked it:
  # every Linux job pins 6.3.3 and the macOS job takes the newest Xcode on the
  # image. The whole matrix tested the toolchain the author happened to use.
  #
  # That is not hypothetical. A query timeout reported on time and failed to stop
  # the statement — for fifty seconds against a fifty-millisecond deadline — on
  # Swift 6.1 and nowhere else, and it took six CI rounds to find because the one
  # job that could see it was the one job nobody had pinned. Pinning macOS to the
  # newest Xcode then *removed* that coverage, which is the opposite of the fix.
  #
  # So this job runs the floor. If it goes red, either the code needs to work
  # there or the floor needs to move — and both are decisions worth making
  # deliberately rather than discovering from a user.
  #
  # 6.1 rather than 6.0 because that is the oldest image Swift publishes for this
  # platform; the tools version is the older promise and the gap is noted in
  # docs/platforms.md.
  # `Package.swift` says `swift-tools-version: 6.0`, so 6.0 is the floor we
  # advertise — and this job pinned 6.1 for months, which meant the advertised
  # floor was the one version nothing compiled. It did not hold: 6.0.3 rejected
  # ten `EventLoopFuture.wait()` calls inside `async` test functions that later
  # toolchains let through, and its `#require` macro could not expand an optional
  # chain running through a subscript.
  #
  # Both were fixed rather than floored away — the `wait()` calls were a genuine
  # hazard (blocking a cooperative-pool thread while the suite runs in parallel),
  # not a dialect difference.
  minimum-toolchain:
    name: Oldest supported Swift (6.0)
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4

      - name: Which toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      # The integration suites skip here — no fixtures — but every state machine,
      # codec, the builder and the whole SQLite suite run, which is where a
      # version difference in the concurrency runtime would show.
      - name: Test
        run: swift test

  musl:
    name: Static musl (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container: swift:6.3.3
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    env:
      SDK_URL: https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
      # Pinned, not optional. `--checksum` can be omitted and the install still
      # works, which would mean a 300 MB unverified download on every run — and
      # this project is careful about provenance everywhere else.
      # Recompute with: swift package compute-checksum <bundle>
      SDK_CHECKSUM: 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
    steps:
      - uses: actions/checkout@v4

      # The static SDK links musl rather than glibc, so anything reaching for a
      # glibc-shaped symbol fails here and not in production. It is also the one
      # configuration that produces a binary with no runtime dependencies.
      # Retried, because the installer itself is what fails. On one run it
      # segfaulted mid-install (exit 139, after printing a Swift backtrace) while
      # the aarch64 job installed the identical SDK from the identical URL without
      # complaint. That is a crash in the toolchain, not a fact about this
      # repository, and a job that goes red for it teaches people to ignore the
      # jobs that go red for real reasons.
      - name: Install the static Linux SDK
        run: |
          for attempt in 1 2 3; do
            if swift sdk install "$SDK_URL" --checksum "$SDK_CHECKSUM"; then
              exit 0
            fi
            echo "── SDK install failed on attempt $attempt, retrying"
            swift sdk remove "${SDK_ID:-swift-6.3.3-RELEASE_static-linux-0.1.0}" 2>/dev/null || true
            sleep 10
          done
          echo "SDK install failed three times — this is not transient" >&2
          exit 1

      - name: Build
        run: swift build --swift-sdk ${{ matrix.arch }}-swift-linux-musl


  # The platform the manifest claims and nothing had ever compiled.
  #
  # `Package.swift` declares `.iOS(.v17)`, which means SwiftPM will happily let
  # someone add Swizzle to an iOS app — and `docs/platforms.md` said "declared in
  # Package.swift, never built" the whole time. The first run of this job found a
  # genuine break on the very first C target it reached: the ed25519 shim included
  # `<sys/random.h>`, which is in the macOS SDK and not in the iPhoneOS one.
  #
  # Build only: there is no way to run a test suite on a simulator from here, and
  # compiling is what the claim is actually about.
  #
  # Library targets rather than the whole package. The CLI is a command line tool
  # and has no business on iOS; these four pull in everything under it — the
  # builder, the migrator, both drivers, the pool and all three C targets.
  #
  # If this goes red, the honest response is to fix it or to narrow `platforms:`,
  # not to keep advertising it.
  ios:
    name: iOS (build only)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Which toolchain
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      # `--target`, not `--product`. `--product Swizzle` draws
      # "cannot be used with the automatic product 'Swizzle'; building the
      # default target instead" and quietly builds the whole package, which is
      # not what the loop claimed to be doing.
      #
      # The SDK and target have to reach clang as well as swiftc, because three
      # of the targets are C: the SQLite amalgamation, libsodium's ed25519
      # subset and the zlib shim.
      - name: Build for iOS
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build \
            --target SwizzleSQLiteEngine --target SwizzleMySQLEngine \
            --target SwizzlePostgres --target SwizzleOnlineDDL \
            -Xswiftc -sdk -Xswiftc "$SDK" \
            -Xswiftc -target -Xswiftc arm64-apple-ios17.0 \
            -Xcc -isysroot -Xcc "$SDK" \
            -Xcc -target -Xcc arm64-apple-ios17.0

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The only unpinned toolchain in the matrix, and it cost five rounds of
      # chasing a driver bug that was not there.
      #
      # Every Linux job pins `container: swift:6.3.3`. This one took whatever the
      # runner image shipped, which was Xcode 16.4 — Swift 6.1, two minor versions
      # behind what the project is developed and tested against. A timeout test
      # failed here and nowhere else, 37 local runs could not reproduce it even
      # with the CPU fully saturated, and the instrumented message eventually
      # showed the statement *was* aborted, just fifty seconds late: cancellation
      # arriving late, not an abort that failed.
      #
      # Selecting the newest Xcode on the image narrows that gap, and printing the
      # version means the next surprise names its own toolchain instead of taking
      # a week to notice one was different.
      - name: Use the newest toolchain on the image
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Build
        run: swift build --build-tests

      # Runs *before* the full suite, alone, and answers one question.
      #
      # Two timing tests failed the last run at 19.12s and 19.13s against a
      # ten-second bound. Near-identical numbers from tests that execute in
      # parallel points at a shared resource rather than at either being slow, and
      # 19 seconds is not explicable as ordinary scheduler noise — the entire
      # suite runs in 132 seconds on this runner.
      #
      # One of the two touches no database at all: `withQueryTimeout(50ms)` around
      # a `Task.sleep`. So the delay is in the timeout path or in the runtime under
      # it, and the driver has been blamed for it through five attempted fixes.
      #
      # The hypothesis is cooperative thread-pool starvation: these runners are
      # three-core, the suite runs CPU-bound SQLite queries in parallel, and a
      # starved runtime delays cancellation delivery no matter how correct the code
      # is. This step tests that and nothing else.
      #
      #   passes alone, fails in the suite  → contention from our own tests
      #   fails alone                       → the timeout path is genuinely broken,
      #                                       and deleting the test would have
      #                                       buried it
      #
      # `continue-on-error` because the answer is the point, not the verdict: a red
      # cross here would say the same thing twice while hiding the full-suite
      # result underneath it.
      - name: Timeout cancellation, in isolation
        continue-on-error: true
        run: |
          echo "── the deterministic one: does cancellation reach the body at all"
          swift test --filter "QueryTimeoutCancellationTests"
          echo "── the timed ones, alone, with nothing else competing"
          swift test --filter "returnsWithoutAwaitingTheBody"
          swift test --filter "timeoutActuallyInterrupts"

      # Same skipping behaviour as Linux — no fixtures here either. The macOS job
      # earns its place by covering the Darwin-only halves of the `#if
      # canImport(Darwin)` branches, which the Linux jobs never compile.
      - name: Test
        run: swift test

      # Compile-error gates: the central claim of the builder's design is that
      # `.returning()` on MySQL cannot be *written*, and that can only be checked
      # by compiling snippets out of band and asserting they fail.
      - name: Capability gating must be compile-time
        run: ./Scripts/negative-tests.sh
