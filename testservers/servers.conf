# Integration test servers: <name> <version> <port> <seed>
#
# Version-pinned deliberately — auth plugin availability moves between releases,
# and a matrix built on "latest" would miss what deployments actually run.
#
#   11.4  LTS. ed25519; no parsec (that arrived in 11.6).
#   11.8  LTS. ed25519 + parsec.
#   12.3  Current. ed25519 + parsec.
mariadb114 11.4.13 3306 base
mariadb118 11.8.9  3307 parsec
mariadb123 12.3.3  3308 parsec

# MySQL. Present so the paths MariaDB cannot exercise are actually verifiable:
# caching_sha2_password (fast + RSA full auth), sha256_password, zstd
# compression, MySQL-dialect GTIDs and COM_BINLOG_DUMP_GTID.
#
# The three of them also happen to cover the whole life of
# `mysql_native_password`, which is the auth plugin most existing deployments
# still present:
#
#   8.0  On by default. Still the most widely deployed MySQL by a wide margin,
#        and for a long time the matrix had every version except this one.
#        Pinned at .40 rather than the newest patch because Oracle stopped
#        publishing macOS builds partway through the series and .43 has none.
#   8.4  LTS. Present but disabled — the fixture starts it with
#        --mysql-native-password=ON.
#   9.1  Current. Removed outright, hence the separate seed.
mysql80 8.0.40 3311 mysql  mysql
mysql84 8.4.3  3309 mysql  mysql
mysql91 9.1.0  3310 mysql9 mysql

# Postgres. The second engine, and the reason the engine abstraction exists —
# transactional DDL, advisory locks and $1 placeholders all differ from MySQL,
# so it is the fixture that proves the migrator is not quietly MySQL-shaped.
#
# wal_level=logical is set at startup so logical decoding is available if we
# ever want the Postgres equivalent of the binlog work.
#
# Three versions, bracketing the supported range rather than filling it. The
# wire protocol barely moves between 14 and 18 — but the **catalog does**, and
# the schema introspector and the query analyzer are built on catalog queries.
# `pg_attribute`, `pg_constraint` and the range types gain columns and change
# shape across majors, so a version that parses on 16 and not on 14 is the
# realistic failure, not a framing bug.
#
#   14  Oldest still supported upstream, and where multiranges arrived.
#   16  The version developed against.
#   18  Current. Adds direct TLS negotiation, which this driver does not
#       implement — connecting at all against 18 is the point.
postgres14 14.24.0 5433 postgres postgres
postgres16 16.15.0 5432 postgres postgres
postgres18 18.6.0  5434 postgres postgres
